<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Responsive Landing Page</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Roboto', sans-serif;
      margin: 0;
      scroll-behavior: smooth;
    }
    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 2rem;
      background-color: #333;
      color: #fff;
    }
    nav a {
      color: white;
      text-decoration: none;
      margin: 0 1rem;
      transition: color 0.3s;
    }
    nav a:hover {
      color: #00bcd4;
    }
    .hero {
      padding: 100px 20px;
      background: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)), url('https://source.unsplash.com/1600x900/?nature') center/cover no-repeat;
      color: white;
      text-align: center;
    }
    .hero h1 {
      font-size: 3rem;
    }
    .hero p {
      font-size: 1.2rem;
      margin: 20px 0;
    }
    .hero button {
      padding: 10px 20px;
      background-color: #00bcd4;
      border: none;
      color: white;
      font-size: 1rem;
      cursor: pointer;
      transition: background-color 0.3s;
    }
    .hero button:hover {
      background-color: #0097a7;
    }
    .section {
      padding: 50px 20px;
    }
    .about {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
    }
    .about img {
      max-width: 400px;
      width: 100%;
      margin-left: 20px;
    }
    .contact-form {
      max-width: 500px;
      margin: auto;
    }
    .contact-form input,
    .contact-form textarea {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
    }
    .api-data {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
    }
    .card {
      border: 1px solid #ddd;
      padding: 15px;
      width: 200px;
      text-align: center;
    }
    @media(max-width: 768px) {
      .about {
        flex-direction: column;
        text-align: center;
      }
      .about img {
        margin: 20px 0 0 0;
      }
    }
  </style>
</head>
<body>
  <nav>
    <div>Logo</div>
    <div>
      <a href="#home">Home</a>
      <a href="#about">About</a>
      <a href="#services">Services</a>
      <a href="#contact">Contact</a>
    </div>
  </nav>

  <section id="home" class="hero">
    <h1>Welcome to Our Landing Page</h1>
    <p>Your gateway to awesome experiences</p>
    <button onclick="document.getElementById('contact').scrollIntoView({ behavior: 'smooth' })">Get in Touch</button>
  </section>

  <section id="about" class="section about">
    <div>
      <h2>About Us</h2>
      <p>We provide exceptional services to help you grow your business and reach new heights.</p>
    </div>
    <img src="download.jpeg" alt="About Image">
  </section>

  <section id="services" class="section">
    <h2 style="text-align:center">Country Info (REST Countries API)</h2>
    <input type="text" id="search" placeholder="Search country..." style="display:block;margin:10px auto;padding:8px;width:80%;max-width:400px;">
    <div id="loading" style="text-align:center">Loading...</div>
    <div class="api-data" id="api-data"></div>
  </section>

  <section id="contact" class="section">
    <h2 style="text-align:center">Contact Us</h2>
    <form class="contact-form">
      <input type="text" placeholder="Name" required>
      <input type="email" placeholder="Email" required>
      <textarea rows="5" placeholder="Message" required></textarea>
      <button type="submit">Send Message</button>
    </form>
  </section>

  <script>
    const apiUrl = 'https://restcountries.com/v3.1/all';
    const apiContainer = document.getElementById('api-data');
    const loading = document.getElementById('loading');
    const searchInput = document.getElementById('search');
    let countries = [];

    async function fetchCountries() {
      try {
        const res = await fetch(apiUrl);
        const data = await res.json();
        countries = data;
        displayCountries(data);
        loading.style.display = 'none';
      } catch (err) {
        loading.textContent = 'Failed to load data';
        console.error(err);
      }
    }

    function displayCountries(data) {
      apiContainer.innerHTML = '';
      data.forEach(country => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <h4>${country.name.common}</h4>
          <img src="${country.flags.svg}" alt="flag" width="100">
          <p>Population: ${country.population.toLocaleString()}</p>
          <p>Region: ${country.region}</p>
        `;
        apiContainer.appendChild(card);
      });
    }

    searchInput.addEventListener('input', () => {
      const query = searchInput.value.toLowerCase();
      const filtered = countries.filter(c => c.name.common.toLowerCase().includes(query));
      displayCountries(filtered);
    });

    fetchCountries();
  </script>
</body>
</html>
